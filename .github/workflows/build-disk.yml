---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["anaconda-iso"]
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      # osbuild sandboxes each stage in its own namespaces; Ubuntu's AppArmor userns
      # restriction makes the mounts inside those sandboxes fail with "permission denied".
      - name: Allow osbuild sandboxes to mount
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nanobot-os-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      # GitHub caps release files at 2 GiB, so the ISO is published in parts, with
      # checksums and the commands to rejoin them in the release notes.
      - name: Publish the ISO as a GitHub release
        if: github.event_name == 'workflow_dispatch' && matrix.disk-type == 'anaconda-iso'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          iso="$(find "$OUT_DIR" -name '*.iso' | head -n 1)"
          [ -n "$iso" ] || { echo "no ISO found in $OUT_DIR"; exit 1; }
          day="$(date -u +%Y%m%d)"
          tag="nanoaurora-${day}-$(date -u +%H%M)"
          name="NanoAurora-${day}-x86_64.iso"
          mkdir -p release
          echo "$(sha256sum "$iso" | cut -d' ' -f1)  $name" > "release/$name.sha256"
          split -b 1900M -d -a 1 "$iso" "release/$name.part"
          cd release
          parts=( "$name".part* )
          sha256sum "${parts[@]}" > SHA256SUMS-parts
          join_windows="copy /b $(printf '%s + ' "${parts[@]}" | sed 's/ + $//') $name"
          {
            echo "NanoAurora installer, built $(date -u +%Y-%m-%d) from \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest\`."
            echo
            echo "## Download"
            echo
            echo "GitHub limits release files to 2 GB, so the ISO comes in ${#parts[@]} parts. Download every \`.part\` file and \`$name.sha256\` into one folder, then join them."
            echo
            echo "**Windows** (Command Prompt, in that folder):"
            echo
            echo '```'
            echo "$join_windows"
            echo "certutil -hashfile $name SHA256"
            echo '```'
            echo
            echo "**Linux / macOS:**"
            echo
            echo '```'
            echo "cat $name.part* > $name"
            echo "sha256sum -c $name.sha256    # macOS: shasum -a 256 -c $name.sha256"
            echo '```'
            echo
            echo "The hash must match \`$name.sha256\`. Then write the ISO to a USB stick with Fedora Media Writer, Rufus, or balenaEtcher."
            echo
            echo "## Install"
            echo
            echo "1. Boot the stick and run the installer. When you create your account, tick **Make this user administrator**."
            echo "2. Log in. The NanoAurora agent setup opens by itself; have a dedicated OpenRouter API key with a low credit limit ready."
            echo "3. Open **NanoAurora** from the app menu."
            echo
            echo "If the machine won't boot with Secure Boot on: disable it, boot, run \`ujust enroll-secure-boot-key\` (password \`universalblue\`), reboot, enroll the key, then turn Secure Boot back on."
            echo
            echo "Updates are opt-in: run \`nanoaurora update\` whenever you want the newest build."
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "NanoAurora ${day}" --notes-file notes.md \
            "${parts[@]}" "$name.sha256" SHA256SUMS-parts

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
