---
name: Release the app

# Freezes the NanoBorealis app with PyInstaller (through `flet pack`, which bundles Flet's own
# runtime so nothing downloads on first launch) on each platform, checks that the frozen app
# really runs, packages it, and publishes a release: a Windows installer, a macOS disk image and
# a Linux archive with an install script. Three channels, as the app's updater sees them:
#
#   dev      every push that changes the app, automatically: X.Y.Z-dev.N pre-releases
#   testing  by hand: X.Y.Z-rc.N pre-releases, candidates for the next stable version
#   stable   by hand: X.Y.Z releases, what everyone gets by default
#
# None of them is marked Latest: that stays the OS installer, which install sticks follow.
on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/client-release.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel"
        type: choice
        options: [testing, stable, dev]
        default: testing
      version:
        description: "Version for testing or stable, e.g. 0.3.0 (dev builds number themselves)"
        required: false
      ref:
        description: "Commit or tag to build, e.g. the commit of a testing build you're promoting (default: main)"
        required: false

permissions:
  contents: write

concurrency:
  group: client-release-${{ inputs.channel || 'dev' }}
  cancel-in-progress: ${{ (inputs.channel || 'dev') == 'dev' }}  # a newer dev build replaces an older one

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      numeric: ${{ steps.plan.outputs.numeric }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'dev' }}
          VERSION_IN: ${{ inputs.version }}
          REF_IN: ${{ inputs.ref }}
        run: |
          # The newest stable version: dev builds count towards the one after it.
          stable="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^client-v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("client-v")]
                  | sort_by(split(".") | map(tonumber)) | last // "0.0.0"')"
          case "$CHANNEL" in
            dev)
              IFS=. read -r major minor patch <<<"$stable"
              base="$major.$minor.$((patch + 1))"
              version="$base-dev.$GITHUB_RUN_NUMBER" ;;
            testing|stable)
              [[ "$VERSION_IN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Give a version like 0.3.0"; exit 1; }
              base="$VERSION_IN"
              version="$base"
              [ "$CHANNEL" = testing ] && version="$base-rc.$GITHUB_RUN_NUMBER" ;;
            *) echo "::error::Unknown channel $CHANNEL"; exit 1 ;;
          esac
          if gh release view "client-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::client-v$version is already released"; exit 1
          fi
          # Windows' file-version field takes numbers only.
          numeric="$base.$([ "$CHANNEL" = stable ] && echo 0 || echo "$GITHUB_RUN_NUMBER")"
          # A short commit or a tag works too: the release needs the full commit it was built from.
          ref="$(gh api "repos/$GITHUB_REPOSITORY/commits/${REF_IN:-$GITHUB_SHA}" --jq .sha)" \
            || { echo "::error::There's no commit or tag called ${REF_IN}"; exit 1; }
          echo "Releasing $version on the $CHANNEL channel from $ref (newest stable: $stable)"
          { echo "channel=$CHANNEL"; echo "version=$version"; echo "numeric=$numeric"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NUMERIC: ${{ needs.plan.outputs.numeric }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux libraries for Flet's window
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-0 libmpv2 xvfb

      - name: Freeze with PyInstaller
        working-directory: client/src
        run: |
          printf 'VERSION = "%s"\n' "$VERSION" > version.py  # the app compares this with newer releases
          python -m pip install --quiet "flet[desktop]==1.0.1" "flet-cli==1.0.1" "websockets>=14" "zeroconf>=0.130" pyinstaller pillow
          sep=":"; icon=assets/icon.png; layout=--onedir
          if [ "$RUNNER_OS" = Windows ]; then sep=";"; icon=assets/icon.ico; fi
          if [ "$RUNNER_OS" = macOS ]; then layout=""; fi  # an .app is a folder already
          flet pack main.py --yes $layout --name NanoBorealis --icon "$icon" \
            --add-data "assets${sep}assets" \
            --product-name NanoBorealis --product-version "$NUMERIC" --file-version "$NUMERIC" \
            --file-description "NanoBorealis $VERSION" --company-name "NanoBorealis contributors" \
            --copyright "Apache-2.0" --bundle-id io.github.more-than-just-kyrion.nanoborealis \
            --distpath ../dist
          ls ../dist

      # The frozen app must reach the stick writer, which is how it writes install sticks with
      # administrator rights. A missing setup file makes it report an error without a window.
      - name: The frozen app runs
        working-directory: client
        run: |
          case "$RUNNER_OS" in
            Windows) app=dist/NanoBorealis/NanoBorealis.exe ;;
            macOS)   app=dist/NanoBorealis.app/Contents/MacOS/NanoBorealis ;;
            *)       app=dist/NanoBorealis/NanoBorealis ;;
          esac
          progress="$RUNNER_TEMP/progress.json"
          "$app" write --disk 0 --serial none --source latest --setup-file "$RUNNER_TEMP/missing.json" --progress "$progress" || true
          for i in $(seq 1 30); do [ -f "$progress" ] && break; sleep 1; done
          cat "$progress"
          grep -q '"phase": "error"' "$progress"

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\client\dist\NanoBorealis" client\packaging\windows.iss
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item client\packaging\Output\*.exe out\

      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          cp -R client/dist/NanoBorealis.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname NanoBorealis -srcfolder dmg -ov -format UDZO "out/NanoBorealis-$VERSION-macos.dmg"

      - name: Package (Linux archive)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out "stage/NanoBorealis-$VERSION"
          cp -a client/dist/NanoBorealis "stage/NanoBorealis-$VERSION/"
          cp client/packaging/install-linux.sh "stage/NanoBorealis-$VERSION/install.sh"
          cp client/src/assets/icon.png "stage/NanoBorealis-$VERSION/"
          chmod +x "stage/NanoBorealis-$VERSION/install.sh"
          tar -C stage -czf "out/NanoBorealis-$VERSION-linux-x86_64.tar.gz" "NanoBorealis-$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: out/*

  release:
    name: Publish the release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      REF: ${{ needs.plan.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release
        run: |
          v="$VERSION"
          ls -la out
          (cd out && sha256sum * > SHA256SUMS)
          case "$CHANNEL" in
            stable)  title="NanoBorealis app $v"; pre=""
                     lead="The NanoBorealis app: chat with your agent from any computer, share this computer's hardware with it, and make install sticks. No Python needed." ;;
            testing) title="NanoBorealis app $v (testing)"; pre="--prerelease"
                     lead="**Testing build**: a candidate for the next stable version. Apps on the Testing or Development channel get it; Stable doesn't." ;;
            dev)     title="NanoBorealis app $v (dev build)"; pre="--prerelease"
                     lead="**Development build** from ${REF:0:7}: newest changes, not yet tested. Only apps on the Development channel get it." ;;
          esac
          cat > notes.md <<EOF
          $lead

          | Platform | Download | Install |
          |---|---|---|
          | Windows 10/11 | \`NanoBorealis-Setup-$v.exe\` | Run it. It installs for your user, with Start menu and desktop shortcuts. |
          | macOS | \`NanoBorealis-$v-macos.dmg\` | Open it and drag NanoBorealis to Applications. The app isn't notarized yet: the first time, right-click it and choose Open. |
          | Linux (x86-64) | \`NanoBorealis-$v-linux-x86_64.tar.gz\` | Unpack it and run \`./install.sh\`. Needs GTK 3 (on every desktop Linux). |

          Making install sticks works on Windows and Linux. \`SHA256SUMS\` lists the checksums. The update channel is under **App updates** in the app.
          EOF
          gh release create "client-v$v" out/* --repo "$GITHUB_REPOSITORY" --target "$REF" --title "$title" \
            --notes-file notes.md --latest=false $pre

      # Keep the releases page readable: only the five newest dev builds stay.
      - name: Tidy old dev builds
        if: needs.plan.outputs.channel == 'dev'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^client-v.*-dev\\.")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
                || echo "::warning::couldn't remove $old"
            done
