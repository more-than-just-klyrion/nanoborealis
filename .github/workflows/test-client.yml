---
name: Test client

# Runs the client's protocol checks against a real nanobot gateway, at the version the
# agent image pins, with a stand-in model, so a protocol change breaks here first.
on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'system_files/usr/share/nanoborealis/image/Containerfile'
      - 'system_files/usr/libexec/nanoborealis-remote'
      - '.github/workflows/test-client.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'client/**'
      - 'system_files/usr/libexec/nanoborealis-remote'
  workflow_dispatch:

jobs:
  protocol:
    name: Client against a real nanobot gateway
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nanobot at the image's version, and the client's dependencies
        run: |
          version="$(sed -n 's/^ARG NANOBOT_VERSION=//p' system_files/usr/share/nanoborealis/image/Containerfile)"
          echo "nanobot $version"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "nanobot-ai==$version" "websockets>=14" "flet==1.0.1" "zeroconf>=0.130"

      - name: Start the stand-in model and a gateway
        working-directory: client
        run: |
          nohup "$RUNNER_TEMP/venv/bin/python" dev/stub_llm.py 18080 > "$RUNNER_TEMP/stub.log" 2>&1 &
          nohup "$RUNNER_TEMP/venv/bin/nanobot" gateway --foreground --config dev/gateway-config.json > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:18791/health >/dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:18791/health

      # The OS's remote-access service in front of the gateway, as on a NanoBorealis computer; in
      # test mode it writes each PIN to a file instead of the screen.
      - name: Start the remote-access service
        run: |
          mkdir -p "$RUNNER_TEMP/remote"
          NANOBOREALIS_REMOTE_PORT=18866 NANOBOREALIS_REMOTE_UPSTREAM_PORT=18765 \
          NANOBOREALIS_REMOTE_STATE="$RUNNER_TEMP/remote" NANOBOREALIS_REMOTE_TEST_SECRET=test-password \
          NANOBOREALIS_REMOTE_TEST_PIN_FILE="$RUNNER_TEMP/pin" \
            nohup python3 system_files/usr/libexec/nanoborealis-remote > "$RUNNER_TEMP/remote.log" 2>&1 &
          for i in $(seq 1 30); do grep -q 'paired devices on port' "$RUNNER_TEMP/remote.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/remote.log"

      - name: Pairing, and what it turns away
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/pairing_check.py 127.0.0.1:18866 "$RUNNER_TEMP/pin" "$RUNNER_TEMP/paired.json"'

      - name: Protocol checks, as a paired device over TLS
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/smoke.py "$RUNNER_TEMP/paired.json"'

      - name: Compute sharing, end to end through a relay
        working-directory: client
        env:
          STUB_INSTALLED: "qwen3:30b"
          STUB_SPEEDS: "qwen3:30b=5,qwen3:14b=6,*=40"
        run: |
          nohup "$RUNNER_TEMP/venv/bin/python" dev/stub_ollama.py 18434 > "$RUNNER_TEMP/stub-ollama.log" 2>&1 &
          mkdir -p "$RUNNER_TEMP/home2"
          HOME="$RUNNER_TEMP/home2" nohup "$RUNNER_TEMP/venv/bin/nanobot" gateway --foreground --config dev/gateway-compute.json > "$RUNNER_TEMP/gateway2.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:18792/health >/dev/null && break
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/remote2"
          NANOBOREALIS_REMOTE_PORT=18867 NANOBOREALIS_REMOTE_UPSTREAM_PORT=18766 \
          NANOBOREALIS_REMOTE_STATE="$RUNNER_TEMP/remote2" NANOBOREALIS_REMOTE_TEST_SECRET=test-password \
          NANOBOREALIS_REMOTE_TEST_PIN_FILE="$RUNNER_TEMP/pin2" \
            nohup python3 ../system_files/usr/libexec/nanoborealis-remote > "$RUNNER_TEMP/remote2.log" 2>&1 &
          for i in $(seq 1 30); do grep -q 'paired devices on port' "$RUNNER_TEMP/remote2.log" && break; sleep 1; done
          "$RUNNER_TEMP/venv/bin/python" dev/compute_smoke.py 127.0.0.1:18867 "$RUNNER_TEMP/pin2"

      - name: The UI module loads
        working-directory: client/src
        run: '"$RUNNER_TEMP/venv/bin/python" -c "import main; print(\"ok\")"'

      - name: Gateway and remote-access logs
        if: always()
        run: |
          tail -n 80 "$RUNNER_TEMP/gateway.log" || true
          tail -n 20 "$RUNNER_TEMP/stub.log" || true
          tail -n 40 "$RUNNER_TEMP/remote.log" "$RUNNER_TEMP/remote2.log" || true
