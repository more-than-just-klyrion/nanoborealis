[project]
name = "nanoborealis-client"
version = "0.1.0"
description = "Chat with your NanoBorealis agent from any device"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flet==1.0.1",
  "websockets>=13",
  "zeroconf>=0.130",
]

[project.optional-dependencies]
# The desktop runtime; `flet build` bundles its own, so packaged apps don't need it.
desktop = ["flet-desktop==1.0.1"]

[tool.flet]
org = "io.github.more-than-just-kyrion"
product = "NanoBorealis"
company = "NanoBorealis"
copyright = "NanoBorealis contributors"

[tool.flet.app]
path = "src"
